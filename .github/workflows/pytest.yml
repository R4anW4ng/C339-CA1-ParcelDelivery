name: Run pytest


on: #trigger the workflow
  push:

jobs: 
  test: #job name is "test"
    runs-on: ubuntu-latest
    steps:
      - name: Get the code #Downloads code from my repo. 
        uses: actions/checkout@v4

      - name: Set up Python #Check if python is installed.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies #install dependancies & libaries. 
        run: python -m pip install -r requirements.txt

      - name: Run pytest #runs the pytest command
        run: python -m pytest -v --cov=src --cov-report=term-missing
